services:
  mysql:
    container_name: roomsplit-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  redis:
    container_name: roomsplit-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build: .
    container_name: roomsplit-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: mysql
      Database__Port: "3306"
      Database__Name: roomsplit
      Database__User: root
      Database__Password: ${MYSQL_ROOT_PASSWORD}
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=1000,asyncTimeout=1000"
      # false = no cache at all (baseline for scripts/measure-members-cache.ps1).
      Cache__Enabled: ${CACHE_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
